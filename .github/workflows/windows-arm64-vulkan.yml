name: Windows ARM64 Vulkan
# CI trigger probe: no functional changes; verify Actions detects this PR push.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish an ARM64 Vulkan release after a successful build"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - master
      - ci/windows-arm64-vulkan
    paths:
      - ".github/workflows/windows-arm64-vulkan.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "examples/**"
      - "ggml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/windows-arm64-vulkan.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "examples/**"
      - "ggml"

permissions:
  contents: read

concurrency:
  group: windows-arm64-vulkan-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_VERSION: "1.4.357.0"
  PACKAGE_NAME: stable-diffusion-win-arm64-vulkan.zip

jobs:
  build:
    name: Cross-build, verify, and package ARM64 Vulkan
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK with ARM64 cross-link libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed: $LASTEXITCODE" }
          & $installer --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.arm64
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed: $LASTEXITCODE" }
          foreach ($required in @("$sdkRoot\Include\vulkan\vulkan.h", "$sdkRoot\Lib-ARM64\vulkan-1.lib", "$sdkRoot\Bin\glslc.exe")) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing cross-build component: $required" }
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Windows ARM64 Vulkan with ClangCL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $args = @(
            "-S", ".", "-B", "build-arm64-vulkan",
            "-G", "Visual Studio 17 2022", "-A", "ARM64", "-T", "ClangCL",
            "-DSD_VULKAN=ON",
            "-DGGML_VULKAN=ON",
            "-DSD_OPENCL=OFF",
            "-DSD_WEBP=OFF",
            "-DSD_WEBM=OFF",
            "-DSD_SERVER_BUILD_FRONTEND=OFF",
            "-DSD_BUILD_SHARED_LIBS=ON",
            "-DSD_BUILD_SHARED_GGML_LIB=ON",
            "-DGGML_BACKEND_DL=ON",
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_CPU_ARM_ARCH=armv8-a",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DCMAKE_CXX_FLAGS=/bigobj /EHsc",
            "-DVulkan_LIBRARY=$env:VULKAN_SDK\Lib-ARM64\vulkan-1.lib",
            "-DVulkan_INCLUDE_DIR=$env:VULKAN_SDK\Include",
            "-DVulkan_GLSLC_EXECUTABLE=$env:VULKAN_SDK\Bin\glslc.exe"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed: $LASTEXITCODE" }
          $cache = Get-Content build-arm64-vulkan\CMakeCache.txt
          foreach ($flag in @("SD_VULKAN", "GGML_VULKAN", "GGML_BACKEND_DL")) {
            $matched = $cache | Where-Object { $_ -match "^$([regex]::Escape($flag)):(BOOL|UNINITIALIZED)=(ON|TRUE|YES|1)$" }
            if (-not $matched) {
              $actual = $cache | Where-Object { $_ -match "^$([regex]::Escape($flag)):" }
              throw "Expected $flag=ON in Vulkan CMakeCache.txt (found: $actual)"
            }
          }
          $vulkanLib = $cache | Where-Object { $_ -match '^Vulkan_LIBRARY:(FILEPATH|UNINITIALIZED)=.*Lib-ARM64.*vulkan-1\.lib$' }
          if (-not $vulkanLib) {
            throw "Vulkan library is not the ARM64 SDK import library"
          }

      - name: Build ARM64 Vulkan server and CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build-arm64-vulkan --config Release --target sd-server sd-cli --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "ARM64 Vulkan compilation failed: $LASTEXITCODE" }

      - name: Verify ARM64 binaries and Vulkan backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "build-arm64-vulkan\bin\Release"
          if (-not (Test-Path $bin)) { throw "Missing Release output directory: $bin" }
          foreach ($name in @("sd-server.exe", "sd-cli.exe", "stable-diffusion.dll", "ggml-vulkan.dll")) {
            if (-not (Test-Path (Join-Path $bin $name))) { throw "Missing package binary: $name" }
          }
          $files = Get-ChildItem -LiteralPath $bin -File | Where-Object { $_.Extension -in @(".exe", ".dll") }
          if (-not $files) { throw "No binaries found" }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw "$($file.Name) is not ARM64 PE (0x$('{0:X4}' -f $machine))"
            }
            Write-Host "ARM64 confirmed: $($file.Name)"
          }
          $vkDll = Join-Path $bin "ggml-vulkan.dll"
          $binaryText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($vkDll))
          if ($binaryText.IndexOf("vulkan-1.dll", [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw "ggml-vulkan.dll does not link against the Vulkan loader"
          }

      - name: Package Windows ARM64 Vulkan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "stable-diffusion-arm64-vulkan"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "build-arm64-vulkan\bin\Release\*" -Destination $stage -Recurse -Force
          $loader = Join-Path $env:VULKAN_SDK "Bin-ARM64\vulkan-1.dll"
          if (Test-Path -LiteralPath $loader) {
            Copy-Item -LiteralPath $loader -Destination $stage -Force
          }
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $stage "stable-diffusion.cpp.txt")
          Copy-Item -LiteralPath ggml\LICENSE -Destination (Join-Path $stage "ggml.txt")
          Compress-Archive -Path "$stage\*" -DestinationPath $env:PACKAGE_NAME -CompressionLevel Optimal -Force

      - name: Upload Windows ARM64 Vulkan zip
        uses: actions/upload-artifact@v4
        with:
          name: stable-diffusion-win-arm64-vulkan
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release only after successful build
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "arm64-vulkan-$short"
          $releaseArgs = @(
            "release", "create", $tag, $env:PACKAGE_NAME,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "Windows ARM64 Vulkan $short",
            "--notes", "Windows ARM64 stable-diffusion.cpp with ggml-vulkan, sd-server and sd-cli. Requires an ARM64 Vulkan GPU driver. Binaries verified by GitHub Actions.",
            "--latest=false"
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
