name: Windows ARM64 Vulkan diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-arm64-vulkan-diagnostics.yml"

permissions:
  contents: read

env:
  VULKAN_VERSION: "1.4.357.0"

jobs:
  build:
    name: Build ARM64 Vulkan result-checking CLI
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK with ARM64 cross-link libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed: $LASTEXITCODE" }
          & $installer --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.arm64
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed: $LASTEXITCODE" }
          foreach ($required in @("$sdkRoot\Include\vulkan\vulkan.h", "$sdkRoot\Lib-ARM64\vulkan-1.lib", "$sdkRoot\Bin\glslc.exe")) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing cross-build component: $required" }
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the Vulkan shader generator for x64 host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakePath = 'ggml/src/ggml-vulkan/CMakeLists.txt'
          $source = Get-Content -LiteralPath $cmakePath -Raw
          $anchor = '        SOURCE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/vulkan-shaders'
          if (-not $source.Contains($anchor)) { throw "GGML Vulkan shader generator CMake layout changed" }
          $hostConfig = @(
            '        CMAKE_GENERATOR "Visual Studio 17 2022"'
            '        CMAKE_GENERATOR_PLATFORM x64'
            '        CMAKE_GENERATOR_TOOLSET ClangCL'
            $anchor
          ) -join "`n"
          $source = $source.Replace($anchor, $hostConfig)
          Set-Content -LiteralPath $cmakePath -Value $source -Encoding utf8

      - name: Configure checked Windows ARM64 Vulkan build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $args = @(
            "-S", ".", "-B", "build-arm64-vulkan-check",
            "-G", "Visual Studio 17 2022", "-A", "ARM64", "-T", "ClangCL",
            "-DSD_VULKAN=ON",
            "-DGGML_VULKAN=ON",
            "-DGGML_VULKAN_CHECK_RESULTS=ON",
            "-DSD_OPENCL=OFF",
            "-DSD_WEBP=OFF",
            "-DSD_WEBM=OFF",
            "-DSD_BUILD_SHARED_LIBS=ON",
            "-DSD_BUILD_SHARED_GGML_LIB=ON",
            "-DGGML_BACKEND_DL=ON",
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_CPU_ARM_ARCH=armv8-a",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DCMAKE_CXX_FLAGS=/bigobj /EHsc",
            "-DVulkan_LIBRARY=$env:VULKAN_SDK\Lib-ARM64\vulkan-1.lib",
            "-DVulkan_INCLUDE_DIR=$env:VULKAN_SDK\Include",
            "-DVulkan_GLSLC_EXECUTABLE=$env:VULKAN_SDK\Bin\glslc.exe"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed: $LASTEXITCODE" }

      - name: Build checked ARM64 Vulkan CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build-arm64-vulkan-check --config Release --target sd-cli --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "ARM64 Vulkan compilation failed: $LASTEXITCODE" }

      - name: Package checked ARM64 Vulkan CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "build-arm64-vulkan-check\bin\Release"
          foreach ($name in @("sd-cli.exe", "stable-diffusion.dll", "ggml-vulkan.dll")) {
            if (-not (Test-Path (Join-Path $bin $name))) { throw "Missing diagnostic binary: $name" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "stable-diffusion-arm64-vulkan-check"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$bin\*" -Destination $stage -Recurse -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "stable-diffusion-win-arm64-vulkan-check.zip" -CompressionLevel Optimal -Force

      - name: Upload checked ARM64 Vulkan CLI
        uses: actions/upload-artifact@v4
        with:
          name: stable-diffusion-win-arm64-vulkan-check
          path: stable-diffusion-win-arm64-vulkan-check.zip
          if-no-files-found: error
          retention-days: 7
